<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Inverting Amplifier - LIC Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-circuit="non-inverting">
    <div class="container">
        <a href="index.html" class="back-link">← Back to Home</a>
        
        <header class="circuit-header">
            <h2 id="circuit-title"></h2>
            <p id="circuit-formula-container" class="hidden">Formula: <code id="circuit-formula"></code></p>
        </header>

        <div class="main-diagram">
            <svg viewBox="0 0 600 350" class="skeleton-svg">
                <!-- Power Supply Pins -->
                <line x1="350" y1="125" x2="350" y2="80" stroke-width="2"/>
                <text x="340" y="75" font-size="12">+Vcc</text>
                <line x1="350" y1="175" x2="350" y2="220" stroke-width="2"/>
                <text x="340" y="235" font-size="12">-Vee</text>

                <!-- Op-Amp Triangle -->
                <path d="M 300 100 L 300 200 L 400 150 Z" fill="none" stroke-width="3"/>
                <text x="310" y="135" font-size="20">-</text>
                <text x="310" y="180" font-size="20">+</text>
                
                <!-- Output Line -->
                <line x1="400" y1="150" x2="480" y2="150" stroke-width="3"/>
                <circle cx="485" cy="150" r="5"/>
                <text x="500" y="140" font-size="16" font-weight="bold" id="svg-vout-label">Vout = --V</text>

                <!-- Non-Inverting Input to Vin -->
                <line x1="300" y1="175" x2="200" y2="175" stroke-width="2"/>
                <circle cx="195" cy="175" r="5"/>
                <text x="100" y="170" font-size="16" font-weight="bold" id="svg-vin-label">Vin = --V</text>

                <!-- Inverting Input Path -->
                <line x1="300" y1="125" x2="220" y2="125" stroke-width="2"/>
                
                <!-- R1 Resistor to Ground -->
                <line x1="220" y1="125" x2="220" y2="180" stroke-width="2"/>
                <path d="M 220 180 L 210 190 L 230 200 L 210 210 L 230 220 L 210 230 L 220 240" fill="none" stroke-width="2"/>
                <text x="240" y="210" font-size="14" font-weight="bold" id="svg-r1-label">R1 = --</text>
                <line x1="220" y1="240" x2="220" y2="260" stroke-width="2"/>
                <!-- Ground Symbol -->
                <line x1="200" y1="260" x2="240" y2="260" stroke-width="2"/>
                <line x1="210" y1="265" x2="230" y2="265" stroke-width="2"/>
                <line x1="215" y1="270" x2="225" y2="270" stroke-width="2"/>

                <!-- Rf Feedback Path -->
                <line x1="220" y1="125" x2="220" y2="50" stroke-width="2"/>
                <line x1="220" y1="50" x2="280" y2="50" stroke-width="2"/>
                <!-- Rf Resistor -->
                <path d="M 280 50 L 290 40 L 300 60 L 310 40 L 320 60 L 330 40 L 340 50" fill="none" stroke-width="2"/>
                <text x="310" y="25" font-size="14" font-weight="bold" id="svg-rf-label">Rf = --</text>
                <line x1="340" y1="50" x2="440" y2="50" stroke-width="2"/>
                <line x1="440" y1="50" x2="440" y2="150" stroke-width="2"/>
            </svg>
            <p>Skeleton Circuit Diagram: Non-Inverting Amplifier</p>
        </div>

        <main class="card">
            <section id="input-container" class="input-section">
                <!-- Inputs will be injected here -->
            </section>

            <div class="button-group">
                <button id="calculate-btn" class="btn btn-primary">Calculate Output</button>
                <button id="reset-btn" class="btn btn-secondary">Reset Fields</button>
            </div>

            <div id="error-message" class="error-message hidden"></div>

            <section id="output-section" class="output-section hidden">
                <hr>
                <div class="result-item">
                    <strong>Calculated Output (V<sub>out</sub>):</strong>
                    <span id="result-display" class="highlight"></span>
                </div>
                <div class="explanation">
                    <strong>How it works:</strong>
                    <p id="explanation-text"></p>
                </div>
                <div class="applications">
                    <strong>Common Applications:</strong>
                    <ul id="applications-list"></ul>
                </div>
            </section>
        </main>

        <footer>
            <p>Developed as a Linear Integrated Circuits mini project.</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
